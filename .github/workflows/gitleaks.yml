name: Gitleaks Secret Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.tag_name')
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan Secrets
        id: scan
        continue-on-error: true
        run: |
          gitleaks git . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Create Findings Report
        if: always()
        run: |
          if [ -f gitleaks-report.json ]; then
            jq '[
              .[] | {
                rule: .RuleID,
                file: .File,
                line: .StartLine,
                commit: .Commit,
                author: .Author,
                description: .Description
              }
            ]' gitleaks-report.json > findings.json
          else
            echo '[]' > findings.json
          fi

      - name: Upload Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: findings.json
          retention-days: 30

      - name: Fail if Secrets Found or Scan Failed
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "::error::Gitleaks detected secrets or the scan failed."
            exit 1
          fi
