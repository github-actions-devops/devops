name: TruffleHog Secrets Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog:
    name: Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the actual PR branch tip, not the synthetic merge commit.
          # This ensures HEAD == PR head commit, so --branch HEAD is unambiguous.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Verify commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "Base : $BASE_SHA"
          echo "Head : $(git rev-parse HEAD)"
          echo ""
          echo "Commits that will be scanned:"
          # This must list your PR commits — if it is empty the scan finds nothing
          git log --oneline "$BASE_SHA..HEAD"

      - name: Scan PR commits
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e

          trufflehog git "file://$(pwd)" \
            --since-commit="$BASE_SHA" \
            --branch="HEAD" \
            --json \
            --fail \
            --no-update \
            > trufflehog_report.json \
            2> trufflehog_stderr.log   # <-- stderr separated; never mixed with JSON

          exit_code=$?

          # Always surface TruffleHog's own log output for debugging
          if [ -s trufflehog_stderr.log ]; then
            echo "--- TruffleHog runtime log ---"
            cat trufflehog_stderr.log
            echo "------------------------------"
          fi

          echo "TruffleHog exit code: $exit_code"

          case "$exit_code" in
            183)
              echo "secrets_found=true" >> "$GITHUB_OUTPUT"

              echo "::error::Secrets detected in this PR!"
              echo ""
              echo "--- Findings ---"
              # trufflehog_report.json is now clean NDJSON — one JSON object per line
              jq -r '
                "Detector : " + (.DetectorName                         // "Unknown") +
                " | Verified: " + (.Verified                          // false | tostring) +
                " | File   : " + (.SourceMetadata.Data.Git.file       // "unknown") +
                " | Line   : " + (.SourceMetadata.Data.Git.line       // "unknown" | tostring) +
                " | Commit : " + ((.SourceMetadata.Data.Git.commit    // "unknown") | .[0:8])
              ' trufflehog_report.json
              ;;
            0)
              echo "secrets_found=false" >> "$GITHUB_OUTPUT"
              echo "No secrets detected."
              ;;
            *)
              echo "secrets_found=error" >> "$GITHUB_OUTPUT"
              echo "::error::TruffleHog exited unexpectedly (code: $exit_code)"
              ;;
          esac

          exit 0

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: |
            trufflehog_report.json
            trufflehog_stderr.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Block merge — secrets found
        if: steps.scan.outputs.secrets_found == 'true'
        run: |
          echo "::error::Secrets were detected. Remove them and push again."
          exit 1

      - name: Block merge — scan error
        if: steps.scan.outputs.secrets_found == 'error'
        run: |
          echo "::error::TruffleHog exited with an unexpected error. Check the logs."
          exit 1
