on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Verify PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "BASE: $BASE_SHA"
          git log --oneline "$BASE_SHA..HEAD"
          echo "Checking config.js:"
          git show HEAD:config.js | head -50
      - name: Scan PR
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e

          trufflehog git "file://$(pwd)" \
            --since-commit="$BASE_SHA" \
            --branch="HEAD" \
            --results=verified,unverified,unknown \
            --json \
            --fail \
            --no-update \
            > trufflehog_report.json 2> trufflehog_stderr.log

          exit_code=$?

          if [ "$exit_code" -eq 183 ]; then
            echo "secrets_found=true" >> "$GITHUB_OUTPUT"

            echo "::error::Secrets detected!"

            jq -r '
              "Detector: \(.DetectorName // "Unknown") | File: \(.SourceMetadata.Data.Git.file // "unknown") | Line: \(.SourceMetadata.Data.Git.line // "unknown") | Commit: \((.SourceMetadata.Data.Git.commit // "unknown")[0:8])"
            ' trufflehog_report.json

          elif [ "$exit_code" -eq 0 ]; then
            echo "secrets_found=false" >> "$GITHUB_OUTPUT"
            echo "No secrets detected."

          else
            echo "secrets_found=error" >> "$GITHUB_OUTPUT"
            cat trufflehog_stderr.log
          fi

          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: |
            trufflehog_report.json
            trufflehog_stderr.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Block merge
        if: steps.scan.outputs.secrets_found != 'false'
        run: |
          echo "::error::Secrets detected or scan failed."
          exit 1
